name: Learning materials checks
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'src/**'
      - 'main.js'
      - '.github/workflows/learning-materials.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'src/**'
      - 'main.js'
      - '.github/workflows/learning-materials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check existing and new learning examples
        run: |
          node scripts/validate-math-review.cjs examples/demo.math-review.json
          node scripts/validate-math-review.cjs examples/learning/analysis.math-review.json
          node scripts/validate-math-review.cjs examples/learning/algebra.math-review.json
      - name: Run authoring and existing plugin tests
        run: npm test
